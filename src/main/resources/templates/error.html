<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Error | EduManage</title>

    <link rel="icon"
          type="image/svg+xml"
          href="https://www.svgrepo.com/show/474860/graduation-cap.svg">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <div class="text-center">

        <h1 class="display-4"
            th:text="${errorTitle}">
            Error
        </h1>

        <p class="lead"
           th:text="${errorMessage}">
            Something went wrong.
        </p>

        <a th:href="@{/home}" class="btn btn-primary">
            Back to EduManage
        </a>

    </div>

</div>

</body>
</html>
