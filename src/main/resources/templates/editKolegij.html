<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Course | EduManage</title>

    <link rel="icon"
          type="image/svg+xml"
          href="https://www.svgrepo.com/show/474860/graduation-cap.svg">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .edit-container {
            max-width: 720px;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            background-color: white;
            border-bottom: 1px solid #edf0f5;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 1.1rem 1.25rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            padding: 0.7rem 0.85rem;
        }

        .form-label {
            font-weight: 500;
        }

        .btn {
            border-radius: 8px;
            font-weight: 500;
        }

        .validation-error {
            font-size: 0.875rem;
            margin-top: 0.35rem;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/students">
            🎓 EduManage
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               href="/students">
                Students
            </a>

            <a class="nav-link"
               href="/profesors">
                Professors
            </a>

            <a class="nav-link active"
               href="/courses">
                Courses
            </a>

            <a class="nav-link"
               href="/upisi">
                Enrollments
            </a>

        </div>

    </div>
</nav>

<main class="container edit-container py-5">

    <div class="mb-4">

        <h1 class="fw-bold mb-1">
            Edit Course
        </h1>

        <p class="text-muted mb-0">
            Update course information and assigned professors.
        </p>

    </div>

    <div class="card">

        <div class="card-header">
            Course Details
        </div>

        <div class="card-body">

            <form th:action="@{/courses/{id}(id=${course.id})}"
                  th:object="${course}"
                  method="post">

                <div class="mb-3">

                    <label for="naziv"
                           class="form-label">
                        Course Name
                    </label>

                    <input type="text"
                           id="naziv"
                           class="form-control"
                           th:field="*{naziv}"
                           th:classappend="${#fields.hasErrors('naziv')} ? 'is-invalid'">

                    <div class="text-danger validation-error"
                         th:if="${#fields.hasErrors('naziv')}"
                         th:errors="*{naziv}">
                    </div>

                </div>

                <div class="mb-4">

                    <label for="profesori"
                           class="form-label">
                        Professors
                    </label>

                    <select id="profesori"
                            name="profesori"
                            class="form-select"
                            multiple>

                        <option th:each="professor : ${allProfessors}"
                                th:value="${professor.id}"
                                th:text="${professor.ime + ' ' + professor.prezime}"
                                th:selected="${course.profesori != null and course.profesori.contains(professor)}">
                        </option>

                    </select>

                    <small class="text-muted">
                        Hold Ctrl/Cmd to select multiple professors.
                    </small>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="/courses"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
