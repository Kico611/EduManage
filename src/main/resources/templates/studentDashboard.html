<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard | EduManage</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body style="background-color: #f5f7fb;">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            EduManage
        </span>

        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm"
                    type="submit">
                Logout
            </button>
        </form>

    </div>
</nav>

<div class="container py-5">

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <h3 th:text="${student.ime}">
                Student Name
            </h3>

            <p class="text-muted mb-1">
                Index:
                <strong th:text="${student.brojIndeksa}">
                    IB001
                </strong>
            </p>

            <p class="text-muted mb-0">
                Email:
                <span th:text="${student.email}">
                    email@example.com
                </span>
            </p>

        </div>

    </div>

    <div class="card border-0 shadow-sm">

        <div class="card-header bg-white">
            <h5 class="mb-0">
                My Courses
            </h5>
        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Course</th>
                        <th>Grade</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="upis : ${upisi}">

                        <td th:text="${upis.kolegij.naziv}">
                            Course
                        </td>

                        <td>

                            <span th:if="${upis.ocjena != null}"
                                  class="badge bg-success"
                                  th:text="${upis.ocjena}">
                                5
                            </span>

                            <span th:if="${upis.ocjena == null}"
                                  class="badge bg-secondary">
                                Not graded
                            </span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(upisi)}">

                        <td colspan="2"
                            class="text-center text-muted py-4">

                            You are not enrolled in any courses.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
