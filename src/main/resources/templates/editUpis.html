<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Grade | EduManage</title>

  <link rel="icon"
        type="image/svg+xml"
        href="https://www.svgrepo.com/show/474860/graduation-cap.svg">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    body {
        background-color: #f5f7fb;
    }

    .edit-container {
        max-width: 720px;
    }

    .card {
        border: none;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .card-header {
        background-color: white;
        border-bottom: 1px solid #edf0f5;
        font-weight: 600;
        font-size: 1.05rem;
        padding: 1.1rem 1.25rem;
    }

    .card-body {
        padding: 1.5rem;
    }

    .form-control {
        border-radius: 9px;
        padding: 0.7rem 0.85rem;
    }

    .form-label {
        font-weight: 500;
    }

    .btn {
        border-radius: 8px;
        font-weight: 500;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <a class="navbar-brand fw-bold"
       href="/students">
      🎓 EduManage
    </a>

    <div class="navbar-nav ms-auto">

      <a class="nav-link"
         href="/students">
        Students
      </a>

      <a class="nav-link"
         href="/profesors">
        Professors
      </a>

      <a class="nav-link"
         href="/courses">
        Courses
      </a>

      <a class="nav-link active"
         href="/upisi">
        Enrollments
      </a>

    </div>

  </div>
</nav>

<main class="container edit-container py-5">

  <div class="mb-4">

    <h1 class="fw-bold mb-1">
      Edit Grade
    </h1>

    <p class="text-muted mb-0">
      Update the grade for this enrollment.
    </p>

  </div>

  <div class="card">

    <div class="card-header">
      Enrollment Details
    </div>

    <div class="card-body">

      <form th:action="@{/upisi/{id}(id=${upis.id})}"
            method="post">

        <div class="mb-3">

          <label class="form-label">
            Student
          </label>

          <input type="text"
                 class="form-control"
                 th:value="${upis.student.ime + ' (' + upis.student.brojIndeksa + ')'}"
                 disabled>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Course
          </label>

          <input type="text"
                 class="form-control"
                 th:value="${upis.kolegij.naziv}"
                 disabled>

        </div>

        <div class="mb-4">

          <label for="ocjena"
                 class="form-label">
            Grade
          </label>

          <input type="number"
                 class="form-control"
                 id="ocjena"
                 name="ocjena"
                 th:value="${upis.ocjena}"
                 min="1"
                 max="5"
                 step="1">

          <small class="text-muted">
            Enter a grade between 1 and 5. Leave empty if the student is not graded yet.
          </small>

        </div>

        <div class="d-flex gap-2">

          <button type="submit"
                  class="btn btn-primary">
            Save Grade
          </button>

          <a href="/upisi"
             class="btn btn-outline-secondary">
            Cancel
          </a>

        </div>

      </form>

    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
